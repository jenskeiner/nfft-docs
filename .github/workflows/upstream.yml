name: Upstream

# Polls NFFT/nfft develop. Shell decides; the model runs only on a change.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  poll:
    name: poll and watch
    # AGENTS_ENABLED false pauses the team; a dispatch still runs.
    if: github.event_name == 'workflow_dispatch' || vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: agents
    concurrency:
      group: upstream
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: true
          fetch-depth: 0
          # The model pushes with the Claude app token the action configures.
          # A push with GITHUB_TOKEN triggers no PR checks.
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v7
        with:
          enable-cache: true

      - name: Poll and bump
        id: poll
        run: bash .github/scripts/upstream-poll.sh

      - name: Watch the diff
        if: steps.poll.outputs.bump == 'true'
        uses: ./.github/actions/agent-setup
        with:
          role: upstream-watcher
          model: claude-sonnet-5-5
          max_turns: "60"
          extra_prompt: |
            Old submodule commit: ${{ steps.poll.outputs.old }}
            New submodule commit: ${{ steps.poll.outputs.new }}
            You are on branch ${{ steps.poll.outputs.branch }} with the bump committed but not pushed.
            The PR body prepared by the poll is in ${{ steps.poll.outputs.body }}.
            Checks on the bump exited with status ${{ steps.poll.outputs.status }}; their output is in the body.
            First push the branch and open the PR: `gh pr create --base develop --head ${{ steps.poll.outputs.branch }} --title "Bump NFFT to ${{ steps.poll.outputs.new }}" --label agent --label upstream --body-file ${{ steps.poll.outputs.body }}`. Then proceed with your procedure.
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
