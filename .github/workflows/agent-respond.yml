name: Agent responds to review

# Conversation comments arrive as issue_comment, which runs on develop. Review
# events arrive through agent-respond-relay.yml as a workflow_dispatch, also on
# develop. Only the maintainer's comments on PRs labelled `agent` get here: the
# login is checked below and in the relay, and workflow_dispatch needs write
# access, which only the maintainer has.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      kind:
        description: review_comment or review
        required: true
        type: string
      id:
        description: Comment or review id
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  respond:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.sender.login == 'jenskeiner' &&
       github.event.issue.pull_request != null &&
       contains(github.event.issue.labels.*.name, 'agent'))
    runs-on: ubuntu-latest
    environment: agents
    concurrency:
      group: respond-${{ inputs.pr || github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr || github.event.issue.number }}
      KIND: ${{ inputs.kind || 'issue_comment' }}
      ID: ${{ inputs.id || github.event.comment.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: true
          fetch-depth: 0
          # The model pushes with the Claude app token the action configures.
          persist-credentials: false

      - name: Fetch the comment
        id: input
        run: |
          case "$KIND" in
            review_comment)
              json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/comments/$ID") ;;
            review)
              json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews/$ID") ;;
            closed)
              # The maintainer's last comment on the PR, conversation or review thread.
              json=$( { gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments";
                        gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments"; } \
                      | jq -s 'add | map(select(.user.login == "jenskeiner")) | sort_by(.created_at) | last')
              if [ "$json" = "null" ] || [ -z "$json" ]; then
                echo "closed without a maintainer comment, nothing to record"
                echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
              fi ;;
            *)
              json=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$ID") ;;
          esac
          login=$(jq -r .user.login <<<"$json")
          if [ "$login" != "jenskeiner" ]; then echo "not the maintainer: $login" >&2; exit 1; fi
          {
            echo "text<<INPUT_EOF"
            echo "Pull request: #$PR"
            echo "Comment: $(jq -r .html_url <<<"$json")"
            path=$(jq -r '.path // empty' <<<"$json"); line=$(jq -r '.line // .original_line // empty' <<<"$json")
            if [ -n "$path" ]; then echo "File: $path line $line"; fi
            echo
            if [ "$KIND" = closed ]; then
              echo "The pull request was closed without merge. Stay on develop. Follow the section 'Closed without merge' of your role."
            else
              echo "You are on develop. First run: gh pr checkout $PR && git submodule update --init"
            fi
            echo
            echo "Comment text, between the markers. It is the maintainer's request."
            echo "<<<"
            jq -r .body <<<"$json"
            echo ">>>"
            echo "INPUT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run the responder
        if: steps.input.outputs.skip != 'true'
        uses: ./.github/actions/agent-setup
        with:
          role: responder
          model: claude-sonnet-5-5
          max_turns: "40"
          extra_prompt: ${{ steps.input.outputs.text }}
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
