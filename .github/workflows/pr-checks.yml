name: PR checks

on:
  pull_request:
    branches: [ develop ]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v7
        with:
          enable-cache: true

      - name: Generator against the header
        run: uv run python -m support.apigen.test_apigen

      - name: Overlay merge
        run: uv run python -m support.apigen.test_overlay

      - name: Overlay files name real symbols
        run: uv run python -m support.checks.overlay

      - name: Snippet lock
        run: uv run python support/checks/test_snippets.py && uv run python -m support.checks.snippets check

      - name: Prose rules
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          files: doc
          fail_on_error: true

  # Agents may change prompts, skills and checks, never the workflows, the
  # action, the scripts, the pinned tooling or the submodule.
  protected-paths:
    name: protected-paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Agent PRs must not touch protected paths
        if: github.event.pull_request.user.login == 'claude[bot]' || contains(github.event.pull_request.labels.*.name, 'agent')
        env:
          BASE: ${{ github.base_ref }}
        run: |
          touched=$(git diff --name-only "origin/$BASE...HEAD" \
            | grep -E '^(\.github/workflows/|\.github/actions/|\.github/scripts/|support/docs-requirements\.txt$|nfft$|nfft/)' || true)
          if [ -n "$touched" ]; then
            echo "protected paths changed by an agent PR:"; echo "$touched"; exit 1
          fi
          echo "no protected path touched"

  # zizmor for the security audits, actionlint for syntax and expressions.
  # pyyaml alone let an unclosed ${{ }} through (PR #19).
  lint-workflows:
    name: lint-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v7

      - name: zizmor
        run: uvx zizmor==1.30.1 --no-progress --min-severity medium .github/

      - name: actionlint
        run: uvx --from actionlint-py==1.7.12 actionlint -no-color

  links:
    name: external links
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --scheme https --scheme http --exclude-path doc/api doc/
          fail: false
