name: Relay review events

# Review events run on the PR head ref. The Claude action refuses to run when
# the workflow file at that ref differs from develop, which is the case for
# every agent branch older than the last infrastructure change. This relay
# holds no secrets; it turns the event into a workflow_dispatch of the
# responder, which then runs on develop.
on:
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  relay:
    if: >-
      github.event.sender.login == 'jenskeiner' &&
      contains(github.event.pull_request.labels.*.name, 'agent') &&
      (github.event_name == 'pull_request_review_comment' ||
       (github.event_name == 'pull_request_review' && github.event.review.body != '') ||
       (github.event_name == 'pull_request' && github.event.pull_request.merged == false))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch the responder on develop
        run: |
          gh workflow run agent-respond.yml --repo "$GITHUB_REPOSITORY" --ref develop \
            -f pr="${{ github.event.pull_request.number }}" \
            -f kind="${{ github.event_name == 'pull_request' && 'closed' || github.event_name == 'pull_request_review' && 'review' || 'review_comment' }}" \
            -f id="${{ github.event.review.id || github.event.comment.id || github.event.pull_request.number }}"
