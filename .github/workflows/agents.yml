name: Agents

# Fixed crons for the product owner and the analyst. The worker cron picks
# its role from agents/roles.json by the best ready issue, so a new role
# needs no change here. Crons run only when the repository variable
# AGENTS_ENABLED is "true"; dispatches always run.
on:
  schedule:
    - cron: "0 5 * * *"      # product-owner
    - cron: "0 7 */2 * *"    # analyst
    - cron: "30 */2 * * *"   # worker
  workflow_dispatch:
    inputs:
      role:
        description: Role to run. worker picks from roles.json.
        required: true
        type: choice
        options: [worker, product-owner, analyst, writer, editor, meta]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  role:
    name: ${{ inputs.role || github.event.schedule }}
    if: github.event_name == 'workflow_dispatch' || vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: agents
    concurrency:
      group: agents-${{ inputs.role || github.event.schedule }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Map the trigger to a role
        id: want
        run: |
          case "${{ inputs.role || github.event.schedule }}" in
            "0 5 * * *")   want=product-owner ;;
            "0 7 */2 * *") want=analyst ;;
            "30 */2 * * *") want=worker ;;
            *) want="${{ inputs.role }}" ;;
          esac
          echo "want=$want" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: true
          fetch-depth: 0
          # The model pushes with the Claude app token the action configures.
          persist-credentials: false

      - name: Gate
        id: gate
        run: bash .github/scripts/agent-gate.sh "${{ steps.want.outputs.want }}"

      - name: Run the role
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/agent-setup
        with:
          role: ${{ steps.gate.outputs.role }}
          model: ${{ steps.gate.outputs.model }}
          max_turns: ${{ steps.gate.outputs.max_turns }}
          # Quoted: a " #" inside an expression starts a YAML comment and leaves ${{ unclosed.
          extra_prompt: "${{ steps.gate.outputs.issue && format('Work issue number {0}. It was chosen by the gate; skip the pick.', steps.gate.outputs.issue) || '' }}"
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
