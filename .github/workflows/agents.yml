name: Agents

# Fixed crons for the product owner and the analyst. The worker cron picks
# its role from agents/roles.json by the best ready issue, so a new role
# needs no change here. Crons run only when the repository variable
# AGENTS_ENABLED is "true"; dispatches always run.
on:
  schedule:
    - cron: "0 */6 * * *"    # product-owner
    - cron: "0 7 */2 * *"    # analyst
    - cron: "30 * * * *"     # worker
  workflow_dispatch:
    inputs:
      role:
        description: Role to run. worker picks from roles.json.
        required: true
        type: choice
        options: [worker, product-owner, analyst, writer, editor, meta]

permissions: {}

jobs:
  role:
    name: ${{ inputs.role || github.event.schedule }}
    if: github.event_name == 'workflow_dispatch' || vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: agents
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    outputs:
      po: ${{ steps.plan.outputs.ok == 'true' }}
    # One group per role, so a dispatch waits for the cron run of the same role.
    concurrency:
      group: agents-${{ inputs.role || (github.event.schedule == '0 */6 * * *' && 'product-owner') || (github.event.schedule == '0 7 */2 * *' && 'analyst') || 'worker' }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Map the trigger to a role
        id: want
        env:
          TRIGGER: ${{ inputs.role || github.event.schedule }}
        run: |
          case "$TRIGGER" in
            "0 */6 * * *") want=product-owner ;;
            "0 7 */2 * *") want=analyst ;;
            "30 * * * *")  want=worker ;;
            *) want="$TRIGGER" ;;
          esac
          echo "want=$want" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: true
          fetch-depth: 0
          # The model pushes with the Claude app token the action configures.
          persist-credentials: false

      - name: Gate
        id: gate
        env:
          BOARD_TOKEN: ${{ secrets.BACKLOG_TOKEN }}
          BACKLOG_OWNER: ${{ vars.BACKLOG_OWNER }}
          BACKLOG_PROJECT: ${{ vars.BACKLOG_PROJECT }}
          BACKLOG_AUTHORS: ${{ vars.BACKLOG_AUTHORS }}
        run: bash .github/scripts/agent-gate.sh "${{ steps.want.outputs.want }}"

      # Runs before the model, which never sees BACKLOG_TOKEN.
      - name: Sync the board
        id: sync
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.role == 'product-owner'
        env:
          BOARD_TOKEN: ${{ secrets.BACKLOG_TOKEN }}
          BACKLOG_OWNER: ${{ vars.BACKLOG_OWNER }}
          BACKLOG_PROJECT: ${{ vars.BACKLOG_PROJECT }}
          BACKLOG_AUTHORS: ${{ vars.BACKLOG_AUTHORS }}
        run: |
          python3 .github/scripts/backlog.py sync > "$RUNNER_TEMP/state.json"
          # Issue titles are in the state; a random delimiter cannot occur there.
          eof="STATE_$(openssl rand -hex 16)"
          {
            echo "prompt<<$eof"
            echo "## Backlog state"
            echo
            cat "$RUNNER_TEMP/state.json"
            echo "$eof"
          } >> "$GITHUB_OUTPUT"

      - name: Run the role
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/agent-setup
        with:
          role: ${{ steps.gate.outputs.role }}
          model: ${{ steps.gate.outputs.model }}
          max_turns: ${{ steps.gate.outputs.max_turns }}
          # Quoted: a " #" inside an expression starts a YAML comment and leaves ${{ unclosed.
          extra_prompt: "${{ steps.gate.outputs.issue && format('Work issue number {0}. It was chosen by the gate; skip the pick.', steps.gate.outputs.issue) || steps.sync.outputs.prompt || '' }}"
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Check the backlog plan
        id: plan
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          if [ ! -f backlog.json ]; then
            echo "::error::The product owner wrote no backlog.json. The board order did not change."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Keep the backlog plan
        if: ${{ !cancelled() && steps.plan.outputs.ok == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-plan
          path: backlog.json
          if-no-files-found: error
          retention-days: 14

  # A fresh checkout: nothing the model wrote runs here except backlog.json,
  # which is data and is validated against the live board.
  apply:
    name: apply backlog plan
    needs: role
    if: ${{ !cancelled() && needs.role.outputs.po == 'true' }}
    concurrency:
      group: backlog-apply
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: agents
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backlog-plan
          path: ${{ runner.temp }}/plan

      - name: Apply the plan
        env:
          GH_REPO: ${{ github.repository }}
          BOARD_TOKEN: ${{ secrets.BACKLOG_TOKEN }}
          BACKLOG_OWNER: ${{ vars.BACKLOG_OWNER }}
          BACKLOG_PROJECT: ${{ vars.BACKLOG_PROJECT }}
          BACKLOG_AUTHORS: ${{ vars.BACKLOG_AUTHORS }}
        run: python3 .github/scripts/backlog.py apply "$RUNNER_TEMP/plan/backlog.json"
