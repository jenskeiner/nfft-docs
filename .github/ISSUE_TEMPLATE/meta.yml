name: Meta
description: Improve the agent system or the site frame, not page content.
title: "[Meta] "
labels: ["meta", "needs-triage", "from-maintainer"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New role or agent
        - Prompt or skill change
        - Check or generator
        - Site structure or navigation
        - UI, theme or CSS
        - Issue or PR templates
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What should be different
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Run ids, transcript lines, PRs or pages that show the problem.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] "
