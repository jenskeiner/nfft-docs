# Configuration of the NFFT3 documentation site.
#
# Run both commands from the repository root. The snippets base path and the
# generator both resolve against the working directory.
#
#   Generate the API pages:
#     uv run python -m support.apigen
#
#   Preview:
#     uv run --with-requirements support/docs-requirements.txt zensical serve
#
#   Build:
#     uv run --with-requirements support/docs-requirements.txt zensical build --strict
#
# The Markdown sources are in doc/. doc/api/ is generated and not in git.

[project]
site_name = "NFFT3"
site_url = "https://jenskeiner.github.io/nfft-docs/"
site_description = "Nonequispaced fast Fourier transforms and related transforms, a C library."
site_author = "Jens Keiner, Stefan Kunis, Daniel Potts"
copyright = "Copyright &copy; 2002-2026 Jens Keiner, Stefan Kunis, Daniel Potts"

repo_url = "https://github.com/jenskeiner/nfft-docs"
repo_name = "jenskeiner/nfft-docs"
# The default branch is develop, so the derived edit/master/doc/ would be wrong.
edit_uri = "edit/develop/doc/"

docs_dir = "doc"

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js",
]

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Install" = "getting-started/index.md" },
    { "First transform" = "getting-started/first-transform.md" },
    { "Build from source" = "getting-started/build-from-source.md" },
    { "Examples" = "getting-started/examples.md" },
  ] },
  { "Guide" = [
    { "Concepts" = "guide/index.md" },
    { "Plans and flags" = "guide/plans-and-flags.md" },
    { "Windows" = "guide/windows.md" },
    { "Precision" = "guide/precision.md" },
    { "OpenMP" = "guide/openmp.md" },
    { "Accuracy" = "guide/accuracy.md" },
    { "Troubleshooting" = "guide/troubleshooting.md" },
    { "Glossary" = "guide/glossary.md" },
  ] },
  { "Transforms" = [
    { "Overview" = "transforms/index.md" },
    { "NFFT" = "transforms/nfft.md" },
    { "NFCT" = "transforms/nfct.md" },
    { "NFST" = "transforms/nfst.md" },
    { "NNFFT" = "transforms/nnfft.md" },
    { "NSFFT" = "transforms/nsfft.md" },
    { "MRI" = "transforms/mri.md" },
    { "NFSFT" = "transforms/nfsft.md" },
    { "NFSFT background" = "transforms/nfsft-background.md" },
    { "NFSOFT" = "transforms/nfsoft.md" },
    { "FPT" = "transforms/fpt.md" },
    { "Solver" = "transforms/solver.md" },
  ] },
  # Generated by support/apigen. Run the generator before building.
  { "API" = [
    { "Overview" = "api/index.md" },
    { "NFFT" = "api/nfft.md" },
    { "NFCT" = "api/nfct.md" },
    { "NFST" = "api/nfst.md" },
    { "NNFFT" = "api/nnfft.md" },
    { "NSFFT" = "api/nsfft.md" },
    { "MRI" = "api/mri.md" },
    { "NFSFT" = "api/nfsft.md" },
    { "NFSOFT" = "api/nfsoft.md" },
    { "FPT" = "api/fpt.md" },
    { "Solver" = "api/solver.md" },
  ] },
  { "Applications" = [
    { "Overview" = "applications/index.md" },
    { "Fast summation" = "applications/fastsum.md" },
    { "Fast Gauss transform" = "applications/fastgauss.md" },
    { "Fast summation on the sphere" = "applications/fastsumS2.md" },
    { "MRI" = "applications/mri.md" },
    { "MRI 2D" = "applications/mri-2d.md" },
    { "MRI 3D" = "applications/mri-3d.md" },
    { "Polar FFT" = "applications/polarFFT.md" },
    { "Radon transform" = "applications/radon.md" },
    { "Quadrature on the sphere" = "applications/quadratureS2.md" },
    { "Inversion on the sphere" = "applications/iterS2.md" },
    { "Reconstruction of a glacier" = "applications/glacier.md" },
  ] },
  { "Interfaces" = [
    { "Julia" = "interfaces/julia.md" },
    { "MATLAB and Octave" = "interfaces/matlab-octave.md" },
  ] },
  { "Reference" = [
    { "Publications" = "reference/publications.md" },
    { "FAQ" = "reference/faq.md" },
    { "People" = "reference/people.md" },
    { "Changelog" = "reference/changelog.md" },
    { "License" = "reference/license.md" },
  ] },
  { "Development" = [
    { "Contributing" = "development/index.md" },
    { "Build matrix" = "development/build-matrix.md" },
    { "Testing" = "development/testing.md" },
    { "Benchmarks" = "development/benchmarks.md" },
    { "Releasing" = "development/releasing.md" },
  ] },
]

[project.theme]
language = "en"
custom_dir = "support/overrides"
logo = "assets/logo.png"
favicon = "assets/favicon.png"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "red"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "red"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Renders the version selector in the header. Without this mike deploys the
# versions but nothing shows them, and the outdated-version banner in
# doc/overrides/main.html stays inert: base.html gates it on config.extra.version.
[project.extra.version]
provider = "mike"
default = "latest"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/NFFT/nfft"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Resolved against the working directory, so run from the repository root.
pymdownx.snippets.base_path = ["nfft", "."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
